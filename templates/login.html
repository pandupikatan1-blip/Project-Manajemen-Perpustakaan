{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} border-0 shadow-sm" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card card-custom p-4 mt-3">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark text-uppercase tracking-wide">Autentikasi Sistem</h3>
                    <p class="text-muted small">LibHub Library Management Console</p>
                </div>
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small fw-bold text-uppercase">Username</label>
                        <input type="text" class="form-control form-control-lg bg-light" id="username" name="username" required autocomplete="off">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-bold text-uppercase">Password</label>
                        <input type="password" class="form-control form-control-lg bg-light" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold text-uppercase" style="background-color: #1e293b;">Masuk Terminal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
